<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dazzling Gown - Register</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* CSS styling for country code dropdown layout */
        .contact-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .country-select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .contact-container input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <form id="registerForm" action="Login-Page.html">
                <!-- First Name: Only letters and spaces -->
                <div class="input-group">
                    <label for="firstName">First name:</label>
                    <input 
                        type="text" 
                        id="firstName" 
                        name="firstName" 
                        pattern="[A-Za-z\s]+" 
                        title="First name must contain only letters and spaces." 
                        required>
                </div>

                <!-- Surname: Only letters and spaces -->
                <div class="input-group">
                    <label for="surname">Surname:</label>
                    <input 
                        type="text" 
                        id="surname" 
                        name="surname" 
                        pattern="[A-Za-z\s]+" 
                        title="Surname must contain only letters and spaces." 
                        required>
                </div>

                <div class="input-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <!-- Contact No: Only numbers with country code drop-down -->
                <div class="input-group">
                    <label for="contactNo">Contact No.:</label>
                    <div class="contact-container">
                        <select id="countryCode" name="countryCode" class="country-select">
                            <option value="+63">🇵🇭 +63 (PH)</option>
                            <option value="+1">🇺🇸 +1 (US)</option>
                            <option value="+44">🇬🇧 +44 (UK)</option>
                            <option value="+61">🇦🇺 +61 (AU)</option>
                            <option value="+81">🇯🇵 +81 (JP)</option>
                            <option value="+65">🇸🇬 +65 (SG)</option>
                        </select>
                        <input 
                            type="tel" 
                            id="contactNo" 
                            name="contactNo" 
                            pattern="[0-9]+" 
                            maxlength="15" 
                            title="Contact number must contain numbers only." 
                            required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" minlength="6" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <p style="font-size: 14px;">Gender:</p>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female" required> Female</label>
                    <label><input type="radio" name="gender" value="others" required> Others</label>
                </div>

                <div style="font-size: 12px; margin-top: 10px;">
                    <label>
                        <input type="checkbox" id="termsCheckbox" required> Terms and Conditions 
                        <a href="Terms-Condition.html" style="font-size: 12px; margin-left: 5px;">(Read)</a>
                    </label>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>

        <div class="brand-side">
            <h1 style="font-style: cursive;">Dazzling Gown</h1>
            <p class="link-text">Already have an account? <a href="Login-Page.html">(Login)</a></p>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Check terms acceptance from query param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('accepted') === 'true') {
                const checkbox = document.getElementById('termsCheckbox');
                if (checkbox) {
                    checkbox.checked = true;
                }
            }

            const firstNameInput = document.getElementById('firstName');
            const surnameInput = document.getElementById('surname');
            const contactInput = document.getElementById('contactNo');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const form = document.getElementById('registerForm');

            // 1. Live restriction: Remove non-letters from name inputs
            [firstNameInput, surnameInput].forEach(input => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^A-Za-z\s]/g, '');
                });
            });

            // 2. Live restriction: Remove non-digits from contact input
            contactInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });

            // 3. Form submission validation
            form.addEventListener('submit', function(e) {
                if (password.value !== confirmPassword.value) {
                    e.preventDefault();
                    alert("Passwords do not match!");
                    confirmPassword.focus();
                }
            });
        };
    </script>
</body>
</html>
